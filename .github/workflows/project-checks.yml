name: Project checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify LFS checkout
        shell: pwsh
        run: |
          git lfs pull
          if (-not (Test-Path -LiteralPath "tools/godot-4.7/Godot_v4.7-stable_win64_console.exe")) {
            throw "Bundled Godot executable was not restored by Git LFS."
          }

      - name: Run Broken Knight checks
        shell: pwsh
        run: .\tools\project.ps1 check
