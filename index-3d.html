<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Broke Knight 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 12%, rgba(82, 116, 150, 0.18), rgba(0, 0, 0, 0) 34%),
        linear-gradient(180deg, #060a10 0%, #080c12 58%, #05070b 100%);
    }

    #three-root {
      position: fixed;
      inset: 0;
    }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #ui-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: crosshair;
      touch-action: none;
    }

    #boot-loading {
      position: fixed;
      inset: 0;
      z-index: 18;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(112, 160, 204, 0.16), rgba(0, 0, 0, 0) 36%),
        linear-gradient(180deg, rgba(4, 8, 14, 0.92) 0%, rgba(3, 6, 10, 0.96) 100%);
      backdrop-filter: blur(10px);
    }

    #boot-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .boot-card {
      --boot-progress: 0%;
      width: min(480px, calc(100vw - 48px));
      padding: 24px 24px 20px;
      border-radius: 24px;
      border: 1px solid rgba(150, 190, 220, 0.22);
      background:
        linear-gradient(180deg, rgba(13, 20, 28, 0.94) 0%, rgba(8, 13, 20, 0.96) 100%);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      color: rgba(236, 242, 248, 0.96);
    }

    .boot-title {
      margin: 0 0 10px;
      font-size: clamp(28px, 3.6vw, 40px);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .boot-subtitle {
      margin: 0 0 16px;
      max-width: 34ch;
      color: rgba(191, 208, 222, 0.86);
      font-size: 13px;
      line-height: 1.5;
    }

    .boot-bar {
      position: relative;
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .boot-bar::before {
      content: "";
      position: absolute;
      inset: 2px;
      width: max(0px, calc(var(--boot-progress) - 4px));
      min-width: 0;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #6cbcff 0%, #a8f0ff 45%, #ffe0a1 100%);
      box-shadow: 0 0 22px rgba(108, 188, 255, 0.28);
      transition: width 180ms ease;
    }

    .boot-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      margin-top: 14px;
    }

    .boot-status {
      font-size: 14px;
      color: rgba(226, 235, 244, 0.95);
    }

    .boot-percent {
      font-size: 13px;
      color: rgba(163, 193, 214, 0.92);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .boot-note {
      margin-top: 14px;
      color: rgba(163, 193, 214, 0.88);
      font-size: 12px;
    }

    .boot-mode-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .boot-mode-btn {
      flex: 1 1 0;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(150, 190, 220, 0.18);
      background: rgba(11, 17, 25, 0.86);
      color: rgba(236, 242, 248, 0.96);
      font: 600 13px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .boot-mode-btn.is-active {
      border-color: rgba(160, 238, 190, 0.44);
      background: rgba(58, 92, 70, 0.84);
    }

    .hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 5;
      max-width: min(380px, calc(100vw - 32px));
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(8, 13, 20, 0.78);
      border: 1px solid rgba(150, 190, 220, 0.18);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      color: rgba(236, 242, 248, 0.95);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .hud.is-muted,
    .hud-actions.is-muted,
    .footer-note.is-muted {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .hud h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .hud p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(204, 217, 229, 0.88);
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin-top: 12px;
      font-size: 12px;
    }

    .hud-grid div {
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-label {
      display: block;
      margin-bottom: 3px;
      color: rgba(164, 190, 210, 0.9);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hud-actions {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 5;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .hud-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 108px;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(150, 190, 220, 0.2);
      background: rgba(8, 13, 20, 0.78);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      color: rgba(236, 242, 248, 0.95);
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .hud-button:hover {
      border-color: rgba(168, 214, 246, 0.34);
      background: rgba(11, 17, 25, 0.9);
    }

    .footer-note {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 5;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(8, 13, 20, 0.72);
      border: 1px solid rgba(150, 190, 220, 0.16);
      color: rgba(204, 217, 229, 0.88);
      font-size: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    #fatal-error {
      position: fixed;
      inset: 16px;
      z-index: 24;
      margin: 0;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid rgba(255, 120, 120, 0.45);
      border-radius: 8px;
      background: rgba(12, 5, 7, 0.94);
      color: #ffd7d7;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      font: 13px/1.45 Consolas, "SFMono-Regular", monospace;
    }
  </style>
</head>
<body>
  <div id="boot-loading" role="status" aria-live="polite">
    <div class="boot-card">
      <h1 class="boot-title">Broke Knight 3D</h1>
      <p class="boot-subtitle">
        Loading the map, forests, save, combat, and UI before play starts.
      </p>
      <div class="boot-bar"></div>
      <div class="boot-meta">
        <div class="boot-status" id="boot-loading-status">Preparing startup...</div>
        <div class="boot-percent" id="boot-loading-percent">0%</div>
      </div>
      <div class="boot-note">The bar now waits for the world map and tree pass before the game opens.</div>
      <div class="boot-mode-row">
        <button class="boot-mode-btn" id="boot-mode-play" type="button">Play</button>
        <button class="boot-mode-btn" id="boot-mode-build" type="button">Build</button>
        <button class="boot-mode-btn" id="boot-mode-river-build" type="button">River Build</button>
      </div>
    </div>
  </div>

  <div id="three-root">
    <canvas id="three-canvas" tabindex="0" aria-label="Broke Knight 3D world"></canvas>
    <canvas id="ui-canvas" tabindex="0" aria-label="Broke Knight 3D game interface"></canvas>
  </div>

  <script type="module" src="./src/main3d.js?v=20260524s"></script>
</body>
</html>
